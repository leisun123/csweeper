[package]
name = "csweeper"
version = "0.1.0"
description = "CSweeper - C盘清道夫，开源的 C 盘选择性清理工具"
edition = "2021"

[lib]
name = "csweeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
globset = "0.4"
glob = "0.3"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
